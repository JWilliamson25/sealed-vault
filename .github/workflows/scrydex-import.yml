name: Import price history from Scrydex (one-time)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = match only (~30 credits); probe = test sealed history (~40 credits); import = download history"
        type: choice
        options: [dry-run, probe, import]
        default: dry-run
      max_credits:
        description: "Stop before using more than this many credits"
        default: "40000"

permissions:
  contents: write

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import from Scrydex
        env:
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID }}
        run: python scripts/scrydex_import.py --max-credits ${{ inputs.max_credits }} ${{ inputs.mode == 'dry-run' && '--dry-run' || inputs.mode == 'probe' && '--probe' || '' }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Scrydex ${{ inputs.mode }}"
          git push
