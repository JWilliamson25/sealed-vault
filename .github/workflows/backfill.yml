name: Backfill price history (run once)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Days between samples (7 = weekly)"
        default: "7"
      since:
        description: "Start date (archives begin 2024-02-08)"
        default: "2024-02-08"

permissions:
  contents: write

concurrency:
  group: price-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Make sure today's data exists
        run: test -f data/meta.json && grep -q '"demo":false' data/meta.json || python scripts/sync.py --force
      - name: Backfill
        run: python scripts/backfill.py --step ${{ inputs.step }} --since ${{ inputs.since }}
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Backfill price history"
          git push
