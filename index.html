<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sealed Vault</title>
  <meta name="description" content="Personal sealed Pokémon TCG price tracker with long-hold buy targets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='3' fill='%23fff' stroke='%23c8202f' stroke-width='3'/%3E%3Crect x='5' y='2' width='22' height='8' rx='2' fill='%23c8202f'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a href="#picks" class="wordmark" aria-label="Sealed Vault home">Sealed Vault</a>
      <p class="asof" id="asof">Loading prices…</p>
      <nav class="tabs" aria-label="Sections">
        <a href="#picks" data-view="picks">Picks</a>
        <a href="#products" data-view="products">All products</a>
        <a href="#sets" data-view="sets">Sets</a>
        <a href="#portfolio" data-view="portfolio">My vault</a>
        <a href="#settings" data-view="settings">Settings</a>
        <a href="#about" data-view="about">How it works</a>
      </nav>
    </div>
  </header>
  <div id="banner"></div>
  <main id="main" tabindex="-1"></main>
  <aside id="sheet" class="sheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-scrim" data-close></div>
    <div class="sheet-panel" id="sheet-panel"></div>
  </aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/engine.js"></script>
  <script src="assets/chart.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
